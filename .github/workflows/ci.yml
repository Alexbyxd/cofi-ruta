name: CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-quality:
    name: Backend Lint, Tests & Schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cofi-ruta-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cofi_user
          POSTGRES_PASSWORD: cofi_password
          POSTGRES_DB: cofi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cofi_user -d cofi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cofi_user:cofi_password@localhost:5432/cofi_test?schema=public
      DATABASE_URL_TEST: postgresql://cofi_user:cofi_password@localhost:5432/cofi_test?schema=public
      JWT_ACCESS_SECRET: testaccesssecret123
      JWT_REFRESH_SECRET: testrefreshsecret123
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/v1/auth/google/callback
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: cofi-ruta-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to test database
        run: npx prisma migrate deploy

      - name: Run Linter
        run: pnpm lint

      - name: Run Unit and DB Tests
        run: pnpm test

  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cofi-rutas-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: cofi-rutas-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Validate Next.js Build
        run: pnpm build
